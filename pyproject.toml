[project]
name = "mlops2-tp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anahi Bazet", email = "anahibazet@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "awswrangler>=3.17.1",
    "grpcio>=1.84.0",
    "grpcio-tools>=1.84.0",
    "imbalanced-learn>=0.14.2",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "mlflow>=3.16.1",
    "optuna>=5.0.0",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
amq2-service-ml = "amq2_service_ml:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
