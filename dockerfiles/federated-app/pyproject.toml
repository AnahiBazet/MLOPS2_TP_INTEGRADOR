[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "water-potability-federated"
version = "0.1.0"
description = "Aprendizaje federado para clasificación de potabilidad del agua"
requires-python = ">=3.11,<3.14"
dependencies = [
    "flwr==1.38.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.5,<2.0",
    "matplotlib>=3.8,<4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["water_federated"]

[tool.flwr.app]
publisher = "water-potability"

[tool.flwr.app.components]
serverapp = "water_federated.server:app"
clientapp = "water_federated.client:app"

[tool.flwr.app.config]
num-server-rounds = 20
local-epochs = 5