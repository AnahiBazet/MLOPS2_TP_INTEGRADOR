syntax = "proto3";

package scoring;

message Features {
  optional double ph = 1;
  optional double hardness = 2;
  optional double solids = 3;
  optional double chloramines = 4;
  optional double sulfate = 5;
  optional double conductivity = 6;
  optional double organic_carbon = 7;
  optional double trihalomethanes = 8;
  optional double turbidity = 9;
}

message Prediction {
  int32 prediction = 1;
  string label = 2;
  double probability = 3;
  int32 model_version = 4;
}

message BatchFeatures {
  repeated Features instances = 1;
}

service Scoring {
  rpc Predict(Features) returns (Prediction);
  rpc PredictStream(BatchFeatures) returns (stream Prediction);
}